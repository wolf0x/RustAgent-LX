[package]
name = "RustAgent"
version = "1.2.0"
edition = "2021"
description = "Cross-platform general-purpose AI agent with WebSocket gateway, multi-model support, and 30+ built-in tools"

[[bin]]
name = "RustAgentX"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
glob = "0.3"
mime_guess = "2"
tokio-stream = "0.1"
rusqlite = { version = "0.31", features = ["bundled"] }
rmcp = { version = "1", features = ["client", "transport-child-process", "client-side-sse", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest", "schemars"] }
aes-gcm = "0.10"
sha2 = "0.10"
getrandom = "0.3"
chromiumoxide = "0.9"
# CLI argument parsing
clap = { version = "4", features = ["derive"] }
base64 = "0.22.1"
sha1 = "0.10"
# Log analysis tools (cross-platform)
regex = "1"
# PCAP analysis
pcap-parser = { version = "0.17", features = ["data"] }
# EML email parsing
mail-parser = "0.9"
# SSH remote execution (pure Rust)
russh = "0.49"
russh-keys = "0.49"
ssh-key = "0.6"
dirs-next = "2.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Cross-platform user information retrieval
whoami = "1"

[build-dependencies]

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = 3
lto = true
